name: Cache Test
on:
  workflow_dispatch:
jobs:
  cache-job:
    runs-on: ubuntu-latest
    steps:
      - name: Restore cache
        id: cache
        uses: actions/cache@v4
        with:
          path: my-cache
          key: my-cache-key-v1

      - name: Create data if cache missed
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p my-cache
          echo "cached data" > my-cache/data.txt

      - name: Show result
        run: |
          echo "Cache hit: ${{ steps.cache.outputs.cache-hit }}"
          cat my-cache/data.txt
