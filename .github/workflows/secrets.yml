name: Secrets and Variables
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  use-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Show variable
        run: echo "Variable is ${{ vars.MY_VAR }}"

      - name: Use secret safely
        env:
          SECRET_VALUE: ${{ secrets.MY_SECRET }}
        run: |
          echo "Trying to print secret: $SECRET_VALUE"
          echo "Secret length is ${#SECRET_VALUE}"

      - name: Call GitHub API with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }} --jq '.full_name'
